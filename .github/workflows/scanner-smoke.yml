name: Scanner smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'gold_miner/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/scanner-smoke.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
